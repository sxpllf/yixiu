# ========================
# DNS（稳定兼容版）
# ========================
# fake-ip 工作原理：
#   所有域名先返回假IP，流量被Clash接管后：
#   国内域名 -> nameserver（国内DoH解析）
#   国外域名 -> fallback（境外DoH解析，DoH请求本身走Clash规则自动走代理）
#   不使用 nameserver-policy 和 #代理标签，兼容性最佳
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 引导DNS：解析DoH服务器地址用（纯UDP，不走规则）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 主DNS：国内DoH
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 境外DNS：非CN域名走此组，DoH请求本身经Clash规则走代理
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://1.0.0.1/dns-query

  # fallback触发条件
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
      - +.twitter.com
      - +.github.com
      - +.telegram.org
      - +.openai.com

  # 代理节点域名解析
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
    - geosite:private
    - time.windows.com
    - +.ntp.org
    - +.time.apple.com
    - +.pool.ntp.org
    - time.cloudflare.com
    - +.stun.l.google.com
    - +.stun.cloudflare.com
    - +.turn.cloudflare.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - dns.msftncsi.com
    - detectportal.firefox.com
    - localhost.ptlogin2.qq.com
    - +.km688.ink
    - +.onesubv.site
    - +.oneyyds.online
    - +.fengyyds.site
    - +.onemg.top
    - +.chybinc.com
    - +.invitevp.com
    - +.vp2.us
    - +.xiaoniuyun.cc
    - +.apple-bing.sbs
