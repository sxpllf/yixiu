rule-anchor:
  # IP 类规则集（CIDR格式，mrs二进制）：interval=86400，每日更新
  ip:   &ip   {type: http, interval: 86400, behavior: ipcidr,    format: mrs}
  # 域名类规则集（trie格式，mrs二进制）：interval=86400，每日更新
  domain: &domain {type: http, interval: 86400, behavior: domain,    format: mrs}
  # 经典规则集（domain/ip/process混合，text格式）：interval=43200，每12小时更新
  class:  &class  {type: http, interval: 43200, behavior: classical, format: text}
  # 高频更新规则集（广告/隐私等频繁变动）：interval=21600，每6小时更新
  fast:   &fast   {type: http, interval: 21600, behavior: classical, format: text}

