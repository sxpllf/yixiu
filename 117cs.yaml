# ========================
# 策略组锚点（分组默认优选）
# ========================

# AI 默认：落地-108 优先（你要求）
ai_default: &ai_default
  type: select
  proxies:
    - 落地-108
    - MGTK
    - 所有-自动
    - 所有-手动
    - 直连
    - 拒绝

# TikTok/强风控：Reality 优先（更稳）
tiktok_default: &tiktok_default
  type: select
  proxies:
    - MGTK
    - 落地-108
    - 美国-自动
    - 美国-手动
    - 所有-自动
    - 所有-手动
    - 直连
    - 拒绝

# 社交/通讯：所有-自动优先（避免单点出口导致风控）
social_default: &social_default
  type: select
  proxies:
    - 所有-自动
    - 所有-手动
    - MGTK
    - 落地-108
    - 香港-自动
    - 新加坡-自动
    - 日本-自动
    - 美国-自动
    - 直连
    - 拒绝

# 流媒体：地区自动优先（解锁靠地理）
stream_default: &stream_default
  type: select
  proxies:
    - 香港-自动
    - 新加坡-自动
    - 日本-自动
    - 美国-自动
    - 香港-手动
    - 新加坡-手动
    - 日本-手动
    - 美国-手动
    - 所有-自动
    - 所有-手动
    - MGTK
    - 落地-108
    - 直连
    - 拒绝

# 开发/工具：固定出口更友好（GitHub/运维/后台）
dev_default: &dev_default
  type: select
  proxies:
    - 落地-108
    - 所有-自动
    - 所有-手动
    - MGTK
    - 香港-自动
    - 新加坡-自动
    - 日本-自动
    - 美国-自动
    - 直连
    - 拒绝

# 交易所/加密：尽量固定出口，降低频繁换IP风控
crypto_default: &crypto_default
  type: select
  proxies:
    - 落地-108
    - MGTK
    - 美国-自动
    - 所有-自动
    - 所有-手动
    - 直连
    - 拒绝

# 国外默认：机场自动优先（你日常更稳，避免所有东西都压108）
foreign_default: &foreign_default
  type: select
  proxies:
    - 所有-自动
    - 所有-手动
    - 落地-108
    - MGTK
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 美国-故转
    - 英国-故转
    - 其他-故转
    - 直连
    - 拒绝

# 国内默认：直连优先
domestic_default: &domestic_default
  type: select
  proxies:
    - 直连
    - 所有-自动
    - 所有-手动
    - 落地-108
    - MGTK
    - 拒绝

proxy-groups:

  # 业务分流组
  - name: TikTok-专用
    <<: *tiktok_default

  - name: T-mobile
    <<: *tiktok_default

  # ===== AI 程序：默认落地-108 =====
  - {name: ChatGPT, <<: *ai_default}
  - {name: Gemini, <<: *ai_default}
  - {name: Copilot, <<: *ai_default}
  - {name: Perplexity, <<: *ai_default}
  - {name: Claude, <<: *ai_default}
  - {name: Meta AI, <<: *ai_default}
  - {name: Grok, <<: *ai_default}
  - {name: Groq, <<: *ai_default}

  # ===== 开发/工具（固定出口优先）=====
  - {name: GitHub, <<: *dev_default}

  # ===== 社交/通讯（避免单点出口）=====
  - {name: Telegram, <<: *social_default}
  - {name: WhatsApp, <<: *social_default}
  - {name: Facebook, <<: *social_default}
  - {name: Reddit, <<: *social_default}

  # ===== 流媒体（地区优先）=====
  - {name: YouTube, <<: *stream_default}
  - {name: Netflix, <<: *stream_default}
  - {name: HBO, <<: *stream_default}
  - {name: Disney, <<: *stream_default}
  - {name: Crunchyroll, <<: *stream_default}
  - {name: Spotify, <<: *stream_default}
  - {name: Popcorn, <<: *stream_default}

  # ===== 交易所（尽量固定IP）=====
  - {name: Crypto, <<: *crypto_default}

  # ===== 三大厂账号体系（更稳妥：不强制固定出口）=====
  - {name: Apple, <<: *social_default}
  - {name: Google, <<: *social_default}
  - {name: Microsoft, <<: *social_default}

  # ===== 其他保持国外默认 =====
  - {name: Amazon, <<: *foreign_default}
  - {name: Nvidia, <<: *foreign_default}
  - {name: Steam, <<: *foreign_default}
  - {name: Games, <<: *foreign_default}
  - {name: Test, <<: *foreign_default}
  - {name: Block, <<: *foreign_default}
  - {name: 国外, <<: *foreign_default}
  - {name: 其他, <<: *foreign_default}

  # 国内类
  - {name: BiliBili, <<: *domestic_default}
  - {name: 国内, <<: *domestic_default}

  # 全部节点集合
  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(直连|拒绝)).)*$"

  # 香港组
  - name: 香港-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 香港-手动
      - 香港-自动

  - name: 香港-手动
    type: select
    include-all: true
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

